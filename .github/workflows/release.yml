name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest and CSS
        run: |
          node -e "const m=require('./manifest.json');if(m.version!==process.env.GITHUB_REF_NAME){console.error('tag != manifest version');process.exit(1)}"
          node -e "const s=require('fs').readFileSync('theme.css','utf8');let d=0;for(const c of s){if(c==='{')d++;if(c==='}')d--;if(d<0)process.exit(1)}if(d!==0){console.error('unbalanced braces');process.exit(1)}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            theme.css
            manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" theme.css manifest.json screenshot.png --title "$GITHUB_REF_NAME" --generate-notes
