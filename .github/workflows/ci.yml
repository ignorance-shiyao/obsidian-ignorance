name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: theme.css is the build of src/parts
        run: |
          npm run build
          git diff --exit-code theme.css
      - name: Manifest and CSS sanity
        run: |
          node -e "const m=require('./manifest.json');for(const k of ['name','version','minAppVersion','author'])if(!m[k]){console.error('manifest missing '+k);process.exit(1)}"
          node -e "const s=require('fs').readFileSync('theme.css','utf8');let d=0;for(const c of s){if(c==='{')d++;if(c==='}')d--;if(d<0)process.exit(1)}if(d!==0){console.error('unbalanced braces');process.exit(1)}"
          test -f screenshot.png
          if grep -nE "@import|url\(https?:" theme.css; then echo "remote resources are not allowed"; exit 1; fi
      - name: Device rules win over the desktop rules they adjust
        run: npm run check:cascade
      - name: Computed-style checks (width, contrast, headings, reading modes)
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm run check:styles
      - name: CSS lint (browser features Obsidian flags, :has)
        run: npm run lint:css
      - name: Release checks (size, metadata, commit emails, clean tree)
        run: npm run check
